<!doctype html><html lang="en"><meta charset="utf-8"><title>Paper Cutout — portable player</title><style>body{margin:0;background:#292c2c;display:grid;place-content:center;min-height:100vh;color:#fff;font:14px system-ui}canvas{height:88vh;width:auto;max-width:96vw;object-fit:contain}nav{padding:8px}button,input{vertical-align:middle}input{width:260px}</style><canvas id="canvas"></canvas><nav><button id="play">Play / pause</button> <input id="seek" type="range" min="0" value="0" step="1"><span id="time"></span></nav><script>
// No generator API, animation framework or network asset dependency.
const q=new URLSearchParams(location.search), url=new URL(q.get('manifest')||'../examples/paris-portable.json',location.href);
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d');
let spec,assets={},playing=false,origin=0,current=0;
function ease(v,type){v=Math.max(0,Math.min(1,v));return type==='smooth'?v*v*(3-2*v):type==='out'?1-(1-v)**3:v}
function state(layer,t){let s={x:0,y:0,width:200,rotation:0,opacity:1,scale:1,...layer};let ks=layer.keyframes||[];if(!ks.length)return s;let a=ks[0],b=a;if(t>=ks.at(-1).t)a=b=ks.at(-1);else if(t>ks[0].t){for(let i=1;i<ks.length;i++)if(t<ks[i].t){a=ks[i-1];b=ks[i];break}}let u=b.t===a.t?0:ease((t-a.t)/(b.t-a.t),b.ease);for(const k of ['x','y','width','rotation','opacity','scale'])s[k]=(a[k]??s[k])+((b[k]??a[k]??s[k])-(a[k]??s[k]))*u;return s}
function pose(asset,t){if(!asset.frames)return asset.images[0];const holds=asset.holds||asset.frames.map(()=>6),total=holds.reduce((a,b)=>a+b,0);let frame=Math.floor(Math.max(0,t)*(asset.fps||spec.fps))%total;for(let i=0;i<holds.length;i++){if(frame<holds[i])return asset.images[i];frame-=holds[i]}return asset.images[0]}
function layer(l,t){if(t<(l.start||0)||t>=(l.end??Infinity))return;let s=state(l,t);if(s.opacity<=0)return;const jitter=l.jitter||{},qt=Math.floor(t*(jitter.hz||8))/(jitter.hz||8);ctx.save();ctx.globalAlpha=s.opacity;ctx.translate(s.x+Math.sin(qt*2.1+(jitter.phase||0))*(jitter.x||0),s.y+Math.sin(qt*3.6+(jitter.phase||0))*(jitter.y||0));ctx.rotate((s.rotation+Math.sin(qt*3.2+(jitter.phase||0))*(jitter.degrees||0))*Math.PI/180);ctx.scale(s.scale,s.scale);
if(l.type==='text'){let size=l.fontSize||48;ctx.font=`${l.weight||'normal'} ${size}px ${l.font||'Georgia'}`;ctx.textBaseline='top';let w=ctx.measureText(l.text).width;if(l.paper){ctx.fillStyle=l.paper;ctx.fillRect(-10,-8,w+20,size*1.2+16)}ctx.fillStyle=l.color||'#243849';ctx.fillText(l.text,0,0)}else if(l.type==='paper'){ctx.fillStyle=l.color||'#eee8d8';ctx.fillRect(0,0,s.width,l.height||100)}else{const im=pose(assets[l.asset],t-(l.start||0)),w=s.width,h=w*im.height/im.width,x=-w*(l.anchorX??.5),y=-h*(l.anchorY??1);let edge=l.paperEdge||0;
if(edge){ // Tint alpha into cream on a reusable offscreen surface; no pose warping.
const oc=document.createElement('canvas');oc.width=im.width;oc.height=im.height;const o=oc.getContext('2d');o.drawImage(im,0,0);o.globalCompositeOperation='source-in';o.fillStyle='#f6efdd';o.fillRect(0,0,oc.width,oc.height);ctx.shadowColor='#15202a33';ctx.shadowBlur=2;ctx.shadowOffsetY=3;for(let k=0;k<12;k++){let a=k*Math.PI/6;ctx.drawImage(oc,x+Math.cos(a)*edge,y+Math.sin(a)*edge,w,h)}ctx.shadowColor='transparent'}ctx.drawImage(im,x,y,w,h)}ctx.restore()}
window.renderFrame=frame=>{current=Math.max(0,Math.min(Math.ceil(spec.duration*spec.fps)-1,frame));const t=current/spec.fps;ctx.clearRect(0,0,canvas.width,canvas.height);ctx.fillStyle=spec.background||'#eee8d8';ctx.fillRect(0,0,canvas.width,canvas.height);for(const sc of spec.scenes){if(t>=sc.start&&t<sc.end){ctx.fillStyle=sc.background||spec.background;ctx.fillRect(0,0,canvas.width,canvas.height);for(const l of sc.layers)layer(l,t-sc.start)}}for(const tr of spec.overlays||[])layer(tr,t);document.querySelector('#seek').value=current;document.querySelector('#time').textContent=t.toFixed(2)+'s'};
window.ready=(async()=>{let r=await fetch(url);if(!r.ok)throw Error('Manifest HTTP '+r.status);spec=await r.json();if(!(spec.width>0&&spec.height>0&&spec.fps>0&&spec.duration>0))throw Error('Invalid dimensions/timing');canvas.width=spec.width;canvas.height=spec.height;window.spec=spec;for(const [id,a] of Object.entries(spec.assets)){if(a.frames&&(!a.frames.length||(a.holds&&a.holds.length!==a.frames.length)))throw Error('Invalid pose sequence '+id);if(a.holds?.some(n=>!Number.isInteger(n)||n<=0))throw Error('holds must be positive integer frame counts');assets[id]={...a,images:await Promise.all((a.frames||[a.src]).map(src=>new Promise((yes,no)=>{let im=new Image();im.onload=()=>yes(im);im.onerror=()=>no(Error('Image load failed: '+src));im.src=new URL(src,url).href})))}}document.querySelector('#seek').max=Math.ceil(spec.duration*spec.fps)-1;window.renderFrame(0);return true})();
function loop(now){if(playing){window.renderFrame(Math.floor((now-origin)/1000*spec.fps)%(Math.ceil(spec.duration*spec.fps)));requestAnimationFrame(loop)}}document.querySelector('#play').onclick=async()=>{await window.ready;playing=!playing;origin=performance.now()-current/spec.fps*1000;if(playing)requestAnimationFrame(loop)};document.querySelector('#seek').oninput=async e=>{await window.ready;playing=false;window.renderFrame(Number(e.target.value))};
window.ready.catch(e=>{document.querySelector('#time').textContent=e.message;console.error(e)});
</script></html>
